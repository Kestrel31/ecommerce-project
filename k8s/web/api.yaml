apiVersion: v1
kind: Service
metadata: { name: api, namespace: web }
spec:
  selector: { app: api }
  ports: [{ port: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: shop/api:dev
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - secretRef: { name: api-db }   # DATABASE_URL
          env:
            - { name: CART_URL, value: "http://cart.cart:3001" }
            - { name: PAYMENT_URL, value: "http://payment.payment:3002" }
            - { name: ADS_URL, value: "http://ads.ads:3003" }
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
