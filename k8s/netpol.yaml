# Backend namespaces accept ingress only from the `web` namespace.
# (Phase 5: add a rule allowing the monitoring namespace to scrape /metrics.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-from-web, namespace: data }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: web }
