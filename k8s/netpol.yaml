# Backend namespaces accept ingress only from `web` (the app) and `monitoring` (Prometheus scrapes).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-from-web, namespace: data }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: web }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-from-web-and-monitoring, namespace: cart }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: web }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
---
