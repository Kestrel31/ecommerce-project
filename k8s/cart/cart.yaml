# In-memory state: keep replicas at 1.
apiVersion: v1
kind: Service
metadata: { name: cart, namespace: cart }
spec:
  selector: { app: cart }
  ports: [{ port: 3001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cart, namespace: cart }
spec:
  replicas: 1
  selector:
    matchLabels: { app: cart }
  template:
    metadata:
      labels: { app: cart }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cart
          image: shop/cart:dev
          ports: [{ name: http, containerPort: 3001 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 3001 }
          livenessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
