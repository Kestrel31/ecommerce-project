apiVersion: v1
kind: Service
metadata: { name: payment, namespace: payment }
spec:
  selector: { app: payment }
  ports: [{ port: 3002 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payment, namespace: payment }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment }
  template:
    metadata:
      labels: { app: payment }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: payment
          image: shop/payment:dev
          ports: [{ containerPort: 3002 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 3002 }
          livenessProbe:
            httpGet: { path: /healthz, port: 3002 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
